name: Integration

on: [push, pull_request]

env:
  WINEDEBUG: -all

jobs:
  download:
    name: Download binaries
    runs-on: ubuntu-latest
    steps:

    - name: Restore original binary
      id: cache
      uses: actions/cache@v6
      with:
        path: binfiles
        key: legobin-lego1

    - name: Download original binary
      if: ${{ !steps.cache.outputs.cache-hit }}
      run: |
        wget https://legoisland.org/download/LEGO1.DLL --directory-prefix=binfiles

    - name: Verify original binary
      run: |
        echo "14645225bbe81212e9bc1919cd8a692b81b8622abb6561280d99b0fc4151ce17 binfiles/LEGO1.DLL" | sha256sum --check

    - name: Download recompiled binaries
      run: |
        wget https://github.com/isledecomp/isle/releases/download/continuous/ReproBit-Debug-Companion.zip
        unzip -q ReproBit-Debug-Companion.zip -d companion
        mv companion/LEGO1.PDB companion/LEGO1.pdb

    - name: Upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: binaries
        path: |
          binfiles
          companion

  reccmp:
    name: Compare
    runs-on: ubuntu-latest
    needs: download
    steps:

    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-isle

    - name: Run reccmp
      shell: bash
      working-directory: ./companion/source
      run: |
        reccmp-reccmp --target LEGO1 | tee result.txt
        grep -qE '^Implemented: +[0-9.]+% +\([1-9][0-9]*' result.txt
        grep -qE '^Accuracy: +[0-9.]+%' result.txt
        grep -E '^(Implemented|Accuracy|Progress):' result.txt >> "$GITHUB_STEP_SUMMARY"

  performance:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: download
    steps:

    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-isle

    - name: Run reccmp 10 times
      shell: bash
      working-directory: ./companion/source
      run: |
        for i in $(seq 1 10); do
          start=$(date +%s%N)
          reccmp-reccmp --target LEGO1 --silent
          end=$(date +%s%N)
          echo $((end - start)) >> times.txt
        done
        awk '{ t = $1 / 1000000000; sum += t; if (min == "" || t < min) min = t; if (t > max) max = t } END { printf "runs: %d\naverage: %.3fs\nminimum: %.3fs\nmaximum: %.3fs\n", NR, sum / NR, min, max }' times.txt | tee -a "$GITHUB_STEP_SUMMARY"

  tools:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    needs: download
    strategy:
      fail-fast: false
      matrix:
        tool: [verexp, vtable, datacmp]
    steps:

    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-isle

    - name: Run ${{ matrix.tool }}
      shell: bash
      working-directory: ./companion/source
      run: |
        reccmp-${{ matrix.tool }} --target LEGO1 2>&1 | tee output.txt || true
        ! grep -q 'Traceback (most recent call last)' output.txt

  cvdump:
    name: cvdump
    runs-on: ubuntu-latest
    needs: download
    steps:

    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-isle
      with:
        project: 'false'

    - name: Read PUBLICS section
      shell: bash
      run: |
        reccmp-cvdump -p companion/LEGO1.pdb -o publics.txt
        grep -q '^\*\*\* PUBLICS' publics.txt
        test "$(grep -c '^S_PUB32: \[' publics.txt)" -gt 0
